# Lefthook git hooks — guard the two commit-time surfaces.
# `mise run setup` runs `lefthook install` to wire these into .git/hooks/.

pre-commit:
  parallel: true
  commands:
    rubocop:
      glob: "*.{rb,rake,ru}"
      run: bin/rubocop --force-exclusion {staged_files}
    syntax:
      glob: "*.rb"
      run: bash tools/scripts/validate/syntax.sh

pre-push:
  parallel: true
  commands:
    validate:
      run: mise run validate:fast

commit-msg:
  commands:
    conventional:
      run: bash tools/scripts/check-commit-msg.sh {1}
