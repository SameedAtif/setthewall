reference_essence:
  medium: flat printed poster / print of botanical specimens (pressed-plant and vintage
    herbarium-plate imagery) on matte paper, displayed in frames with mats
  palette: aged cream and ivory paper grounds; sage, olive and muted grey-greens for
    foliage; dusty blue, lavender-violet, soft rose-pink, pale yellow and ochre for
    blooms; sepia, taupe and warm brown for stems, roots and dried specimens
  palette_character: 'soft, desaturated naturalist palette on warm neutral paper:
    muted greens and earth browns dominate, with gentle cool accents of dusty blue,
    lilac and violet plus faint rose and ochre; low-to-medium saturation, gentle tonal
    contrast, antique faded quality rather than vivid colour'
  surface_treatment: flat matte print surface with no impasto or relief; value carried
    by the delicate silhouette of the specimen against a plain pale ground, faint
    paper ageing/foxing and slight mottling on some sheets; light falls evenly with
    soft ambient shadow, no gloss or sheen
  motif_vocabulary:
  - single pressed flower or plant specimen centered on plain ground
  - slender stems with leaves and branching sprigs
  - clustered blossom heads (hydrangea-like domes, star-shaped florets, daisy-like
    composites)
  - grid arrangements of multiple small specimens per sheet
  - handwritten cursive species annotations and small Latin labels
  - vintage herbarium label blocks, decorative borders and collection stamps
  - aged cream paper ground with subtle foxing/toning
  styling: hung in matched sets (pairs, trios, quartets and six-piece gallery grids)
    in simple wood, carved wood, gold or black frames with wide off-white mats, on
    neutral white, beige or sage walls above linen sofas in calm neutral living rooms
