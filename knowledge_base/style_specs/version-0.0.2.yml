reference_essence:
  medium: 'Framed prints on paper: flat matte paper prints of botanical subjects (pressed-plant
    / herbarium specimens and vintage botanical illustrations), each mounted behind
    a mat or full-bleed on the sheet and housed in a simple frame; the artwork surface
    itself is smooth paper, not canvas or paint.'
  palette: 'Muted, desaturated naturals: warm cream, ivory and beige paper grounds;
    sage, olive and grey-green foliage; dusty blue, lavender-violet and periwinkle
    florals; soft blush pink, mauve and pale yellow accents; dried-plant browns, taupe
    and sepia. Overall low-saturation, mid-to-light value range with only occasional
    small saturated notes (blue, purple, pink) confined to the flowers.'
  styling: Hung in coordinated multi-piece groupings (rows of three or four, 2x2 grids,
    gallery walls of six) on neutral walls — white, warm greige, or sage green — above
    linen/cream sofas with beige and sage cushions; frames are thin natural wood,
    carved light wood, gold gilt, or simple black, usually with a wide off-white mat;
    surrounding decor is soft neutral textiles, wooden coffee tables, ceramic vases
    with dried grasses.
