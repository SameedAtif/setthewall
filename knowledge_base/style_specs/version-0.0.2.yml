  motif_vocabulary:
  - single centered pressed-plant specimen (stem, leaves, flower head) on a plain
    ground
  - gridded array of multiple small pressed specimens / botanical fragments on one
    sheet
  - loose cluster or scatter of pressed petals and blossoms
  - hydrangea-style clustered flower head with broad serrated leaves
  - sprig of compound leaves or foliage branch studied alone
  - dried seed heads and feathery grass silhouettes
  - handwritten cursive species caption at the sheet's lower edge
  - printed herbarium label / institutional stamp block in a corner
  - aged cream paper ground with faint foxing and tonal stains
  surface_treatment: Flat, matte paper surface with no impasto or relief; value changes
    come only from the printed specimen silhouettes against an even, lightly aged
    ground (subtle cream toning, faint foxing/stains in the herbarium sheets). Light
    falls evenly and diffusely across the sheet; delicate fine-line detail in stems,
    leaf veins and seed heads, with handwritten script captions and small printed
    labels/stamps on some sheets. No gloss, no visible brushwork.
